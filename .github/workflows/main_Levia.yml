# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - Levia

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://leviacontainer.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_b0d7a244cf384eb685b6327730c76f63 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_fe43dc4103d944c2a945a046e9e3365b }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: leviacontainer.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_b0d7a244cf384eb685b6327730c76f63 }}/sample-app-aoai-chatgpt:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'Levia'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_c498f080ddf54e3f91cac2a5f2be1b70 }}
        images: 'leviacontainer.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_b0d7a244cf384eb685b6327730c76f63 }}/sample-app-aoai-chatgpt:${{ github.sha }}'