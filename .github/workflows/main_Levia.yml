# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - Levia

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://leviacontainer.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_318a24e67f404c1fbb3c3fdd343e37fb }}
        password: ${{ secrets.AzureAppService_ContainerPassword_09415458344c4f3484244fa6ba436d11 }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: leviacontainer.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_318a24e67f404c1fbb3c3fdd343e37fb }}/sample-app-aoai-chatGPT:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'Levia'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_af02e05ce5084852a1a2c21138f34199 }}
        images: 'leviacontainer.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_318a24e67f404c1fbb3c3fdd343e37fb }}/sample-app-aoai-chatGPT:${{ github.sha }}'